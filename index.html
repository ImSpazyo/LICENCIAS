<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema QR</title>

<!-- LIBRERÍA QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
}

h1{
    text-align:center;
    color:#38bdf8;
}

h2{
    color:#22c55e;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-primary{
    background:#0ea5e9;
    color:white;
}

.btn-download{
    background:#16a34a;
    color:white;
}

#resultado{
    display:none;
    background:white;
    color:black;
    padding:20px;
    border-radius:20px;
    text-align:center;
}

#qr-code{
    display:flex;
    justify-content:center;
    margin-top:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table th,
table td{
    border:1px solid #334155;
    padding:10px;
    text-align:center;
}

table th{
    background:#0f172a;
    color:white;
}

.btn-ver{
    background:#16a34a;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>SISTEMA DE GESTIÓN QR</h1>

<label>Nombre completo</label>
<input type="text" id="nombre">

<label>Fecha de expedición</label>
<input type="date" id="fecha">

<label>Folio</label>
<input type="text" id="folio">

<label>Módulo</label>
<input type="text" id="modulo" value="adiweb">

<button class="btn-primary" onclick="generarQR()">
Generar y Guardar QR
</button>

</div>

<div class="card" id="resultado">

<h2>LICENCIA AUTÉNTICA</h2>

<div id="qr-code"></div>

<div id="datos" style="margin-top:15px"></div>

<button class="btn-download" onclick="descargarQR()">
Descargar PNG
</button>

</div>

<div class="card">

<h2>Historial de registros</h2>

<table>

<thead>
<tr>
<th>Nombre</th>
<th>Fecha</th>
<th>Folio</th>
<th>Módulo</th>
<th>QR</th>
</tr>
</thead>

<tbody id="tabla-registros"></tbody>

</table>

</div>

</div>

<script>

// =====================================
// GENERAR QR
// =====================================

function generarQR(){

    const nombre = document.getElementById('nombre').value;
    const fecha = document.getElementById('fecha').value;
    const folio = document.getElementById('folio').value;
    const modulo = document.getElementById('modulo').value;

    if(!nombre || !fecha || !folio || !modulo){

        alert('Completa todos los campos');

        return;
    }

    // =====================================
    // URL QUE ABRIRÁ EL QR
    // =====================================

    const urlQR =
    `${window.location.origin}${window.location.pathname.replace('index.html','')}verificar.html?nombre=${encodeURIComponent(nombre)}&fecha=${encodeURIComponent(fecha)}&folio=${encodeURIComponent(folio)}&modulo=${encodeURIComponent(modulo)}`;

    // =====================================
    // OBJETO
    // =====================================

    const contenido = {
        nombre,
        fecha,
        folio,
        modulo,
        url:urlQR
    };

    // =====================================
    // GUARDAR LOCALMENTE
    // =====================================

    let registros = JSON.parse(localStorage.getItem('licencias')) || [];

    registros.push(contenido);

    localStorage.setItem('licencias', JSON.stringify(registros));

    // =====================================
    // LIMPIAR QR
    // =====================================

    const qrContainer = document.getElementById('qr-code');

    qrContainer.innerHTML = '';

    // =====================================
    // GENERAR QR
    // =====================================

    new QRCode(qrContainer,{
        text:urlQR,
        width:220,
        height:220
    });

    // =====================================
    // MOSTRAR DATOS
    // =====================================

    document.getElementById('datos').innerHTML = `
        <strong>Nombre:</strong> ${nombre}<br>
        <strong>Fecha:</strong> ${fecha}<br>
        <strong>Folio:</strong> ${folio}<br>
        <strong>Módulo:</strong> ${modulo}
    `;

    document.getElementById('resultado').style.display='block';

    cargarRegistros();
}

// =====================================
// DESCARGAR PNG
// =====================================

function descargarQR(){

    const img = document.querySelector('#qr-code img');

    if(!img){

        alert('Primero genera un QR');

        return;
    }

    const link = document.createElement('a');

    link.href = img.src;

    link.download = 'licencia_qr.png';

    link.click();
}

// =====================================
// HISTORIAL
// =====================================

function cargarRegistros(){

    const tabla = document.getElementById('tabla-registros');

    tabla.innerHTML='';

    const registros = JSON.parse(localStorage.getItem('licencias')) || [];

    registros.forEach((data,index)=>{

        tabla.innerHTML += `
        <tr>
            <td>${data.nombre}</td>
            <td>${data.fecha}</td>
            <td>${data.folio}</td>
            <td>${data.modulo}</td>
            <td>
                <button class="btn-ver"
                onclick="reconstruirQR(${index})">
                Ver QR
                </button>
            </td>
        </tr>
        `;
    });
}

// =====================================
// RECUPERAR QR
// =====================================

function reconstruirQR(index){

    const registros = JSON.parse(localStorage.getItem('licencias')) || [];

    const data = registros[index];

    const qrContainer = document.getElementById('qr-code');

    qrContainer.innerHTML='';

    new QRCode(qrContainer,{
        text:data.url,
        width:220,
        height:220
    });

    document.getElementById('datos').innerHTML = `
        <strong>Nombre:</strong> ${data.nombre}<br>
        <strong>Fecha:</strong> ${data.fecha}<br>
        <strong>Folio:</strong> ${data.folio}<br>
        <strong>Módulo:</strong> ${data.modulo}
    `;

    document.getElementById('resultado').style.display='block';
}

// =====================================
// INICIAR
// =====================================

window.onload = cargarRegistros;

</script>

</body>
</html>

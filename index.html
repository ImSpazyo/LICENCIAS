<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Gestión QR</title>

  <!-- Librería QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    // =====================================================
    // CONFIGURACIÓN FIREBASE
    // =====================================================
    // Reemplaza estos datos con los tuyos desde Firebase
    // https://firebase.google.com/

    const firebaseConfig = {
      apiKey: 'TU_API_KEY',
      authDomain: 'TU_DOMINIO.firebaseapp.com',
      projectId: 'TU_PROJECT_ID',
      storageBucket: 'TU_BUCKET.appspot.com',
      messagingSenderId: 'TU_SENDER_ID',
      appId: 'TU_APP_ID'
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // =====================================================
    // GENERAR QR
    // =====================================================

    window.generarQR = async function () {
      const nombre = document.getElementById('nombre').value;
      const fecha = document.getElementById('fecha').value;
      const folio = document.getElementById('folio').value;
      const modulo = document.getElementById('modulo').value;

      if (!nombre || !fecha || !folio || !modulo) {
        alert('Completa todos los campos');
        return;
      }

      const contenido = {
        titulo: 'LICENCIA AUTÉNTICA',
        nombre,
        fecha,
        folio,
        modulo,
        fechaRegistro: new Date().toISOString()
      };

      // Guardar en Firebase
      try {
        await addDoc(collection(db, 'licencias'), contenido);
      } catch (error) {
        console.error(error);
        alert('Error al guardar en Firebase');
      }

      // Mostrar QR
      document.getElementById('qr-code').innerHTML = '';

      new QRCode(document.getElementById('qr-code'), {
        text: JSON.stringify(contenido),
        width: 220,
        height: 220
      });

      // Mostrar datos
      document.getElementById('datos').innerHTML = `
        <strong>Nombre:</strong> ${nombre}<br>
        <strong>Fecha:</strong> ${fecha}<br>
        <strong>Folio:</strong> ${folio}<br>
        <strong>Módulo:</strong> ${modulo}
      `;

      document.getElementById('resultado').style.display = 'block';

      cargarRegistros();
    }

    // =====================================================
    // DESCARGAR QR PNG
    // =====================================================

    window.descargarQR = function () {
      const img = document.querySelector('#qr-code img');

      if (!img) {
        alert('Genera primero un QR');
        return;
      }

      const link = document.createElement('a');
      link.href = img.src;
      link.download = 'qr_licencia.png';
      link.click();
    }

    // =====================================================
    // CARGAR HISTORIAL
    // =====================================================

    async function cargarRegistros() {
      const tabla = document.getElementById('tabla-registros');
      tabla.innerHTML = '';

      const querySnapshot = await getDocs(collection(db, 'licencias'));

      querySnapshot.forEach((doc) => {
        const data = doc.data();

        tabla.innerHTML += `
          <tr>
            <td>${data.nombre}</td>
            <td>${data.fecha}</td>
            <td>${data.folio}</td>
            <td>${data.modulo}</td>
          </tr>
        `;
      });
    }

    window.onload = cargarRegistros;
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      color: #38bdf8;
    }

    h2 {
      color: #22c55e;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background: #0ea5e9;
      color: white;
    }

    .btn-download {
      background: #16a34a;
      color: white;
    }

    #resultado {
      display: none;
      background: white;
      color: black;
      padding: 20px;
      border-radius: 20px;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    table th,
    table td {
      border: 1px solid #334155;
      padding: 10px;
      text-align: center;
    }

    table th {
      background: #0f172a;
    }

    .documentacion {
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="card">
      <h1>SISTEMA DE GESTIÓN QR</h1>

      <label>Nombre completo</label>
      <input type="text" id="nombre">

      <label>Fecha de expedición</label>
      <input type="date" id="fecha">

      <label>Folio</label>
      <input type="text" id="folio">

      <label>Módulo</label>
      <input type="text" id="modulo" value="adiweb">

      <button class="btn-primary" onclick="generarQR()">
        Generar y Guardar QR
      </button>
    </div>

    <div class="card" id="resultado">
      <h2>LICENCIA AUTÉNTICA</h2>

      <div id="qr-code"></div>

      <div id="datos" style="margin-top:15px"></div>

      <button class="btn-download" onclick="descargarQR()">
        Descargar PNG
      </button>
    </div>

    <div class="card">
      <h2>Historial de Registros</h2>

      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Fecha</th>
            <th>Folio</th>
            <th>Módulo</th>
          </tr>
        </thead>

        <tbody id="tabla-registros"></tbody>
      </table>
    </div>
